# Production-shaped stack: builds the distroless image from Dockerfile,
# no source bind-mount, config from a real .env file. For local development
# with hot reload, use docker-compose.dev.yml instead.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dexta
      POSTGRES_PASSWORD: dexta
      POSTGRES_DB: dexta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dexta -d dexta"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://dexta:dexta@postgres:5432/dexta?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
