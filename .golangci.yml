run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unconvert
    - unparam
    - misspell
    - gocritic
    - errorlint
    - gofmt
    - goimports

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - unparam
