# Development stack: hot-reloading API container (Dockerfile.dev + air)
# with the source tree bind-mounted, and Postgres exposed on the host for
# inspecting with a local DB client. Run with:
#   docker compose -f docker-compose.dev.yml up --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dexta
      POSTGRES_PASSWORD: dexta
      POSTGRES_DB: dexta
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dexta -d dexta"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://dexta:dexta@postgres:5432/dexta?sslmode=disable
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
  go_mod_cache:
